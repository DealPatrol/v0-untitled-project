<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Memorial QR</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
      color: #333;
    }
    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background-color: #d9376e; /* Rose color */
      color: white;
    }
    .content {
      text-align: center;
      max-width: 600px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }
    .button {
      display: inline-block;
      background-color: white;
      color: #d9376e;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.3s;
    }
    .button:hover {
      background-color: #f8f0f4;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <h1>Page Not Found</h1>
      <p>We're sorry, but the page you're looking for doesn't exist.</p>
      <a href="/" class="button">Return to Home</a>
    </div>
  </div>
  <script>
    // Simple client-side tracking
    (function() {
      console.log('404 error tracked:', window.location.pathname);
      // In the future, you could implement an API call here to track 404 errors
    })();
  </script>
</body>
</html>
